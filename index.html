<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form Validation</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="login-card">
    <h1>Login</h1>
    <p class="subtitle">Enter your details to continue</p>
    <form id="loginForm" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username">
      <small class="field-error" id="usernameError"></small>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password">
      <small class="field-error" id="passwordError"></small>

      <button type="submit">Login</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>
    <p class="demo-hint">Demo login: <strong>student</strong> / <strong>Demo@123</strong></p>
  </main>
</body>
</html>
